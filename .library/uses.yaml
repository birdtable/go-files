notes:
  - "go-files is a library: its findings are the old module's copies that the go-files tickets cut. Programs' copies of the same jobs are the programs' findings."
  - "The five go-files packages are first-party picks of every program, not of go-files itself; they are listed in each program matrix as first-party:go-files/<pkg>."
  - "Package names after the renames: confine (was within), appdirs (was paths). Ticket bodies still say within and paths."
  - "No source gives line ranges for the old module files; each `where` names the files and symbols the go-files ticket moves or cuts. trust/home.go leaves go-files (not-for row)."
  - "Each finding is closed: its ticket landed before this file was written, and its note says where the code went at 854284ae3a36ea2ff01665b0943aa0944620ec0a. A closed finding stays one release as the record."
  - "Each call the matrix gave as prose is in its pick's pattern: a hand /etc/group parser (x/sys), a hand flock or LockFileEx and a pid file (gofrs/flock), an import of lock, trust or appdirs from write or confine (the link test)."
  - "The forbidigo row register path-lock excepts internal/loghold's two system files by file, because Append holds its log on its own descriptor and write may import only the standard library and golang.org/x/sys (the link test). The hold moved there from write's two system files (go-files#31), moved and not widened, so filestest.HoldLog takes the one Append takes; write and filestest import it, and no other package. A fifth file that takes a lock is red. The two holdShared test helpers (write/helper_unix_test.go, write/helper_windows_test.go) carry a per-call nolint."
  - "A published matrix of the library's picks is generated from this file."
  - "Each ban states its security or correctness reason, in its pick's ban and in its .golangci.yml desc or msg. A library whose ban would name only a preference is not denied: github.com/hectane/go-acl, github.com/google/safeopen, github.com/kirsle/configdir and github.com/adrg/xdg, nor are os.UserConfigDir, os.UserCacheDir and os.UserHomeDir. The four atomic writers and the two joiners were read in source, and each showed the gap its ban names. go-filemutex and juju/fslock stay denied for security: each, read in source, opens the lock's name following a link and locks it by hand."
