    what: "a hand lock around flock with a pid file and a staleness check; TakeIn and WaitIn have no caller"
    lines: "875 to about 105 (about 800 non-test lines of flock use; about 1,500 test lines)"
    replaced_by:
      - "std syscall.Flock, golang.org/x/sys/windows LockFileEx, crypto/sha256, errors.ErrUnsupported"
