# Each tier's budget and measured floor, on the kind of host the host line names.
#
# pre-push is judged by its CPU time, user plus system, which is the same on a quiet host and a loaded
# one. pre-push-cpu-limit is the most CPU seconds its tree may use there (hatch's cpu_limit): twice its
# CPU floor, the least of three runs of the tier from a fresh clone, each after `go clean -testcache`,
# rounded up to whole seconds. The three runs used 160.6, 164.7 and 165.4 s, at 1-minute loads of
# 3.5, 29.6 and 52.9 at their starts. A push over its CPU limit fails at any load, and no load excuses
# it. pre-push-budget, 10 s, is its wall limit and only a hang guard: a push past it and within its
# CPU limit passes, saying so, and hatch kills a push still running at 10 times it, which fails as
# hung. pre-push-floor is the least wall time of three runs, from before the CPU limit.
#
# pre-commit and release are judged by their wall time. The budget is the most a tier may take there:
# commit 2 s, release 15 s; it stands over any rule of floor times a factor. The floor is the least of
# three runs of the tier from a fresh clone on that kind of host, kept beside its budget. A tier that
# runs past its budget on that kind of host fails, but for a pre-commit whose 1-minute load at its
# start was above 15, which passes saying so. The floors were measured on a busy host, at 1-minute
# loads of 9 to 49, the task cache cleared before each run.
#
# The release tier run on Linux or Windows amd64 outside a hosted runner (GITHUB_ACTIONS unset) has its own budget,
# release-session-budget. On any other kind of host no budget applies, and the time is printed.
# A hosted runner (GITHUB_ACTIONS set) has no budget: its run is held by the 20-minute timeout of its job.
# hatch budget reads a budget from the row `<id>-budget: <seconds>` and a CPU limit from the row
# `<id>-cpu-limit: <seconds>`, whole seconds each, their expressions given by gate/budget.sh, and
# gate/budget.sh reads the host line with awk, so the shape is narrow: a comment line, or a key, a
# colon, a space and a number.
host: Darwin-arm64
pre-commit-floor: 2.56
pre-commit-budget: 2
pre-push-floor: 7.95
pre-push-budget: 10
pre-push-cpu-floor: 160.6
pre-push-cpu-limit: 322
release-floor: 8.15
release-budget: 15
release-session-budget: 60
