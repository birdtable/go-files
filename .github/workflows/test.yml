# Runs go vet, go test, lint, the API check and the vulnerability check on GitHub's hosted runners,
# on Linux, macOS and Windows, for every pull request, every push to main, and by hand. It holds no secret, and its token reads the repository's
# contents alone. Every module is fetched through the public Go module proxy, as a program that
# imports go-files fetches them, and nothing is kept in the Actions cache.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The contract test and the API check read the last release tag and the files it holds, so
          # the checkout fetches the whole history and its tags, not one commit.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Ubuntu's runners keep an unprivileged account from mapping itself in a new user namespace
      # (AppArmor's restrict_unprivileged_userns), which the Linux mount and namespace tests of
      # appdirs, trust and trust/trusttest need, as a stock Linux allows. This lifts that rule on the
      # runner alone; the tests still run as the runner's own account, with no root.
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # GOFLAGS=-mod=mod would let go vet and go test pass on a go.mod or go.sum that is not tidy, so
      # this step fails first on any change go mod tidy would make, and prints it. It checks the
      # root go.mod and each tools/*.mod the task tooling runs through, prints every file's change
      # before it fails, and fails when no tools file is found.
      - name: go mod tidy
        run: |
          status=0
          go mod tidy -diff || status=1
          found=0
          for modfile in tools/*.mod; do
            [ -f "$modfile" ] || continue
            found=$((found + 1))
            go mod tidy -diff -modfile="$modfile" || { echo "not tidy: $modfile" >&2; status=1; }
          done
          if [ "$found" -eq 0 ]; then
            echo "no tools/*.mod found" >&2
            status=1
          fi
          exit "$status"
      - name: go vet
        run: go vet ./...
      # go test runs as the release tier runs it, with the race detector, in shuffled order and never
      # from the test cache, and writes its events as JSON for the step after it to count.
      - name: go test
        id: test
        run: |
          race=-race
          if [ "$(go env CGO_ENABLED)" != 1 ]; then
            race=
          fi
          echo "GO_TEST_RACE=${race:-off}" >> "$GITHUB_ENV"
          go test -json $race -shuffle=on -count=1 ./... > "$RUNNER_TEMP/go-test.json"
      # Counts the passed, failed and skipped tests into the log and the job summary, prints each
      # failed or skipped test's own output, and is red on any failure and on any skip: a test that
      # skips on a runner proves nothing there.
      - name: test counts
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          events="$RUNNER_TEMP/go-test.json"
          count() { jq -R -n --arg a "$1" '[inputs | fromjson? | select(.Test != null and .Action == $a)] | length' "$events" | tr -d '\r'; }
          passed=$(count pass)
          failed=$(count fail)
          skipped=$(count skip)
          jq -R -n -r '[inputs | fromjson? | select(.Test != null)] as $e
            | ($e | map(select(.Action == "fail" or .Action == "skip") | .Package + " " + .Test)) as $bad
            | $e[] | select(.Action == "output") | select((.Package + " " + .Test) as $k | any($bad[]; . == $k)) | .Output' "$events" | tr -d '\r'
          jq -R -n -r '[inputs | fromjson? | select(.Test == null and .Action == "fail")] | .[] | "FAIL " + .Package' "$events" | tr -d '\r'
          line="tests: $passed passed, $failed failed, $skipped skipped (race $GO_TEST_RACE)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_OUTCOME" != success ] || [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ] || [ "$passed" -eq 0 ]; then
            exit 1
          fi
      # Lint, the API check and the vulnerability check run through the repository's own task
      # tooling, each as its own task member, so CI and the local tiers run the same checks. A member
      # called alone is not a tier, so no wall-clock budget is timed: on a hosted runner it would
      # measure the runner, not the code. Each runs whatever the steps before it did, and writes its
      # own pass or fail line to the job summary.
      # lint is golangci-lint with .golangci.yml for linux, darwin, windows, freebsd and netbsd,
      # and the depguard plants that hold the layer rows.
      - name: lint
        if: ${{ !cancelled() }}
        run: |
          if go tool -modfile=tools/task.mod task lint; then result=pass; else result=fail; fi
          echo "lint: $result" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$result" = pass ]
      # api holds the three systems' surfaces to api/systems.txt, the breaks since the last tag to
      # api/breaks/<tag>.txt, and api/marks.txt to go doc. It reads the whole history checked out above.
      - name: api
        if: ${{ !cancelled() }}
        run: |
          if go tool -modfile=tools/task.mod task api; then result=pass; else result=fail; fi
          echo "api: $result" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$result" = pass ]
      # vuln is govulncheck over the module, against the Go vulnerability database as it is today.
      - name: vuln
        if: ${{ !cancelled() }}
        run: |
          if go tool -modfile=tools/task.mod task vuln; then result=pass; else result=fail; fi
          echo "vuln: $result" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$result" = pass ]
