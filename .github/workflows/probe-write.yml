# A throwaway probe, closed with its pull request: write's Windows tests under the race detector at
# two shuffle seeds, five times each, to see whether a crash of write's test binary comes back.
name: probe-write

on:
  pull_request:

permissions:
  contents: read

jobs:
  write:
    strategy:
      fail-fast: false
      matrix:
        seed: ['1795847494802516600', '1795848039612403400']
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org
      SEED: ${{ matrix.seed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: write, race, one seed, five times
        run: |
          fails=0
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            if go test -race -shuffle="$SEED" -count=1 ./write; then r=ok; else r=FAIL; fails=$((fails+1)); fi
            echo "::endgroup::"
            echo "seed $SEED run $i: $r"
          done
          echo "seed $SEED: $fails of 5 failed"
          test "$fails" -eq 0
