# A throwaway probe, closed with its pull request: the full suite on Windows, with and without the
# race detector, as the test workflow runs it, in several parallel samples, to count crashes of a
# test binary.
name: probe-full

on:
  pull_request:

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
        race: ['off']
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org
      RACE: ${{ matrix.race }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: full suite, shuffled
        run: |
          go version
          race=-race
          if [ "$RACE" = off ]; then race=; fi
          rc=0
          go test -json $race -shuffle=on -count=1 ./... > "$RUNNER_TEMP/events.json" || rc=$?
          fails=$(jq -R -r 'fromjson? | select(.Test == null and .Action == "fail") | .Package' "$RUNNER_TEMP/events.json" | tr -d '\r' | sort -u)
          fatal=$(grep -c -E 'fatal error|unexpected return pc|Exception 0x' "$RUNNER_TEMP/events.json" || true)
          seeds=$(jq -R -r 'fromjson? | select(.Output != null) | select(.Output | startswith("-test.shuffle")) | "\(.Package) \(.Output)"' "$RUNNER_TEMP/events.json" | tr -d '\r' | grep -F -f <(printf '%s\n' "$fails" | sed '/^$/d;s/$/ /') || true)
          echo "probe: race $RACE, go test exit $rc, fatal lines $fatal, failed packages: ${fails:-none}"
          printf '%s\n' "$seeds" | sed '/^$/d;s/^/probe seed: /'
          for p in $fails; do echo "::group::output of $p"; jq -R -r --arg p "$p" 'fromjson? | select(.Package == $p and .Output != null) | .Output' "$RUNNER_TEMP/events.json" | tr -d '\r' | grep -v -E '^(=== (RUN|PAUSE|CONT)|--- PASS|PASS$)' | tail -n 120; echo "::endgroup::"; done
          test "$rc" -eq 0
