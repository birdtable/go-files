kind: Added
body: 'appdirs.Volume(path) answers what kind of volume holds a path, links followed, as an appdirs.VolumeInfo: Type, the system''s own name for the file system, and Kind, one of appdirs.Local, Network, FUSE, SyncPlaceholder and Unknown. VolumeInfo.Local() is true for Local alone; the zero VolumeKind is Unknown, and an error comes with the zero VolumeInfo, so neither reads as local. Removable disks are Local. What is detected where: macOS asks statfs''s type name and local-mount flag: APFS, HFS+, FAT and exFAT with the flag are Local, a type that holds fuse is FUSE whatever the flag says, NFS, SMB, AFP, WebDAV, CIFS and FTP are Network, FUSE-T among them, as it mounts through NFS or SMB, and a path in a File Provider domain, told by the system''s domain mark or a com.apple.fileprovider. attribute on it or a folder above it, or an evicted file, is SyncPlaceholder. Linux asks statfs''s magic number, which alone decides, and the mount table''s fstype for Type, fuse.sshfs and other FUSE subtypes among them: ext2 to ext4, XFS, btrfs, f2fs, tmpfs, ZFS, FAT, exFAT, bcachefs and overlay are Local, NFS, SMB, CIFS, AFS, Ceph, Coda and 9p Network, and FUSE FUSE; Linux keeps no sync placeholders. Windows asks the volume''s NT device, drive type and file system name: a remote drive or a \Device\Mup path is Network, a file system whose name holds FUSE is FUSE, and only NTFS, ReFS, FAT and exFAT on a numbered local disk volume, fixed or removable, under no sync root, Local; a path is SyncPlaceholder where it or a folder above it, up to the volume''s root, each opened with no link followed, carries an IO_REPARSE_TAG_CLOUD reparse tag or one of its variants, or where a sync root registered under the SyncRootManager key holds it, matched by whole names with no case. The Cloud Files API''s CfGetSyncRootInfoByPath is not asked, as go-files reaches no DLL''s call by name. The Windows Cloud Files detection is not yet proved on a real OneDrive sync root, as no runner it is tested on has one: the Cloud Files filter can disguise placeholders from a process that has not opted in to seeing them, so the tag half may never see a tag, and the registry half matches a root only as the registry spells it. Until the run of go-files#19 (https://github.com/birdtable/go-files/issues/19) proves it, a caller that must not run on a sync folder should take SyncPlaceholder on Windows as best effort. What reads as Unknown: on macOS a path below Library/CloudStorage or Library/Mobile Documents with no mark, a path whose folders'' attributes cannot be listed, a volume without the local-mount flag that is neither FUSE nor network, and any other type, devfs among them; on Linux any other magic number, procfs, sysfs and the kernel''s NTFS among them; on Windows a path whose reparse tags or the registered sync roots cannot be read, another device, a WinFsp or Dokan drive that names itself NTFS among them, another drive type and another file system. Any other system, FreeBSD among them, is an *fs.PathError matching errors.ErrUnsupported. Non-test Go lines, as task size counts them: appdirs 949 to 1,528, 579 more, the 97 of volume.go, the rules of each system in volume_rule.go, a file for macOS, Linux, Windows and the other systems, and 1 of the package doc; 13,874 to 14,453 in all, of the ceiling''s 14,453.'
