kind: Security
body: 'confine.Collide no longer answers that two names are apart when a file made or removed at one of them, another call''s probe among them, falls between its looks at the two. Before it answers apart it looks at both names again, and answers apart only where neither changed; where they did, it looks again from the start, and where the folder changes under each of three tries it answers that the names are one. Before, on a volume that folds the two names, such as APFS or NTFS, two Collide calls on one folder at once could be told that names the volume takes for one are two. The answer that the names are one is the safe one, and it can now be wrong the other way: raced by other calls, Collide can answer that two names are one on a volume that folds neither, 2 to 9 calls in 100 with eight at once on one folder. One race is left: a file moved away, back and away again at the first name within one call, each move between two of its looks, can still be answered apart.'
