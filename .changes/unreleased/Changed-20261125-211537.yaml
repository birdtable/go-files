kind: Changed
body: The test workflow also runs lint, the API check and the vulnerability check, each through the repository's own task tooling as the local tiers do, with no wall-clock budget, and each writes its pass or fail line to the job summary. Pull requests run on Linux and Windows; pushes to main, v* tags and runs by hand add macOS. A newer run for the same ref cancels the older one.
