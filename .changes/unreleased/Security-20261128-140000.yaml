kind: Security
body: 'Hardening on Windows: lock and write refuse a path, a note or a root on a host''s named pipes before any open beneath it, matching `fs.ErrInvalid`, as confine does: a path that names a device or a pipe, or is on a host''s pipes share (`IPC$` or `pipe`, in any UNC spelling or a `\\?\GLOBALROOT\Device\Mup\` name), by its name; a root, or the folder of a path, by its own handle (its final path, or its file type where the system reads none), so a junction to the pipes'' folder is refused too. lock''s looks and opens by path, and the folder a lock file, a private folder or appdirs'' temp folder is made in, ask for identification alone, and each make refuses a folder on a host''s pipes. confine''s pipes share rule now reads a `GLOBALROOT` name, empty components and a share name''s trailing dots and spaces. confine''s documentation says how far a root on any other share is trusted: only as far as every account that may change a folder above it on the server.'
