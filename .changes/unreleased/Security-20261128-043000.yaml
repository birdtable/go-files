kind: Security
body: 'Hardening on Windows: trust, confine and appdirs refuse a path that names a device or a pipe (`\\.\`, or a `\\?\` or `\??\` path naming neither a drive nor a `Volume{GUID}`) before anything is opened, matching `fs.ErrInvalid` (trust: `ErrNotPlain`). Every open go-files makes with `CreateFile`, and `internal/winapi`''s `OpenAt`, asks for identification alone (`SECURITY_SQOS_PRESENT` with `SECURITY_IDENTIFICATION`), so a pipe that a junction leads to learns who the caller is and may act as it in nothing. confine''s `Resolve` walk looks and reads links by those opens, trust''s `MkdirPrivate` looks for the part of its folder that is there by them, and `Free` and `Volume` ask the system from a handle of their own. A UNC path is not refused: an open of one connects to the named host and authenticates the caller to it, so a program that takes paths from another account refuses one itself. The lint keeps a raw `CreateFile` and a by-name `os` open out of the three packages'' Windows code.'
