kind: Added
body: 'confine.Folds(root) answers how a folder reads names, writing nothing, as a confine.Folding: FoldNone, FoldCase, FoldComposition, FoldBoth or FoldUnknown. macOS asks the volume''s type and case sensitivity, Windows the volume''s file system and flags and the folder''s own case-sensitivity flag, Linux the file system''s type and the folder''s casefold attribute. Where the system cannot say without a write, a case-sensitive APFS volume, a network share, FUSE, XFS and ZFS among them, the answer is FoldUnknown with an error matching confine.ErrNoFolding and errors.ErrUnsupported. FoldUnknown holds both fold bits, so FoldsCase and FoldsComposition answer true for it. Collide''s doc points to Folds for a caller that only asks, and to Portable''s keys as the filter before either. Non-test Go lines, as task size counts them: confine 4,122 to 4,454, 332 more, the 328 of folds.go, the rules of each system in folds_rule.go and a file for macOS, Linux, Windows and the other systems, and 4 of Collide''s doc; 13,508 to 13,840 in all, of the ceiling''s 13,840.'
