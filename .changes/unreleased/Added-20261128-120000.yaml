kind: Added
body: 'confine.Final(path) answers the system''s own name for the folder or file an absolute path opens, read from a handle open on it, so two spellings of one file answer the same bytes and a record keyed by a path can be keyed by it. Windows answers from GetFinalPathNameByHandle with VOLUME_NAME_DOS: the long name in its stored case for an 8.3 short name or another case, with its drive, and without the \\?\ prefix where the name is shorter than MAX_PATH and GetFullPathName gives it back unchanged, so a name ending in a dot or a space, a device''s name and a long name keep it. macOS answers a folder alone, from fcntl''s F_GETPATH: the stored case for another case, the name through the firmlink for /System/Volumes/Data, and a file or folder this account may not read is refused, matching fs.ErrPermission, as the open needs read access; it answers only where the opened file''s volume and the volume of every folder of the answer up to / are apfs, and a name on another volume, msdos and exfat too, or beneath one, is no key and is refused, matching errors.ErrUnsupported, as on HFS+ a folder may have a second name, as a Time Machine disk''s folders do, and F_GETPATH names what is beneath it, a volume mounted there too, by whichever of the folder''s names was looked at last, which HFS+''s count of names cannot tell, and a network or FUSE volume''s server decides what is one folder, and msdos and exfat answer the spelling a name was first looked up by since it entered the cache, not the stored one, while APFS keeps one spelling and, as the system writes it, gives a folder no second name; no type closes a volume whose bytes another account wrote and attached, a disk image or a removable disk, which may give a folder two names on APFS too, so a caller judges such a volume with trust.Path first; and anything but a folder, a file, a link at the last name or a device, is refused, matching errors.ErrUnsupported, as F_GETPATH answers whichever of a file''s names any process looked at last, and a second name linked, looked at and unlinked between any two reads is told by no count of names. Linux answers from the link /proc/self/fd/<n>, read with readlinkat from its own handle, opened, as self/fd is, by openat2 crossing no mount and following no magic link, beneath a /proc held to a procfs''s root by fstatfs''s magic and its inode, as trust reads /proc: a linked parent''s target, and a name this account may not read too, opened with O_PATH; in a folder that folds case it is the spelling the name was first looked up by since it entered the kernel''s cache, which may not be the stored one. A file with a second name, by a hard link, answers on Linux and Windows the name it was opened by. Every link before the last name is followed and a link at the last name is not, so a link answers its own name on Linux and Windows. On Windows a path that names a device or a pipe, not a path on a drive or a volume, is refused before anything is opened, matching fs.ErrInvalid and ErrOutside; the open asks for identification alone, and a pipe or a device a link on the way leads to is no folder or file and is refused, matching fs.ErrInvalid. Elsewhere, and where the call fails or answers no absolute path, as on Linux with no /proc, with a /proc that is not a procfs''s root, with a mount on the way to /proc/self/fd/<n> or on the link itself, or with no openat2, it is an *fs.PathError matching errors.ErrUnsupported, never fs.ErrNotExist; a name not there is fs.ErrNotExist; a relative path is refused, matching fs.ErrInvalid and ErrOutside; and an answer that is no longer the file opened, by os.SameFile, is refused with ErrChanged, though on a Windows volume that gives no file index os.SameFile has nothing to compare. The answer is a key only for a path whose folders no other account or process renames while Final runs: a folder of the path renamed during the call and put back may have Final answer another name of what it opened, as on macOS through a folder with a second name, so a caller that cannot promise that judges the path with trust.Path first.'
