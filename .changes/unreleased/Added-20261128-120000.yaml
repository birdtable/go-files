kind: Added
body: 'confine.Final(path) answers the system''s own name for the folder or file an absolute path opens, read from a handle open on it, so two spellings of one file answer the same bytes and a record keyed by a path can be keyed by it. Windows answers from GetFinalPathNameByHandle with VOLUME_NAME_DOS: the long name in its stored case for an 8.3 short name or another case, with its drive, and without the \\?\ prefix where the name is shorter than MAX_PATH and GetFullPathName gives it back unchanged, so a name ending in a dot or a space, a device''s name and a long name keep it. macOS answers from fcntl''s F_GETPATH: the stored case for another case, the name through the firmlink for /System/Volumes/Data, and a file or folder this account may not read is refused, matching fs.ErrPermission, as the open needs read access; a file, not a folder, with more than one name is refused, matching errors.ErrUnsupported, as F_GETPATH answers whichever of its names any process looked at last. Linux answers from the link /proc/self/fd/<n>, read with readlinkat under that folder once fstatfs shows it is a procfs: a linked parent''s target, and a name this account may not read too, opened with O_PATH; in a folder that folds case it is the spelling the name was first looked up by since it entered the kernel''s cache, which may not be the stored one. A file with a second name, by a hard link, answers on Linux and Windows the name it was opened by. Every link before the last name is followed and a link at the last name is not, so a link answers its own name. Elsewhere, and where the call fails or answers no absolute path, as on Linux with no /proc or with a /proc/self/fd that is not a procfs, it is an *fs.PathError matching errors.ErrUnsupported, never fs.ErrNotExist; a name not there is fs.ErrNotExist; a relative path is refused, matching fs.ErrInvalid and ErrOutside; and an answer that is no longer the file opened, by os.SameFile, is refused with ErrChanged, though on a Windows volume that gives no file index os.SameFile has nothing to compare.'
