kind: Added
body: 'filestest.HoldLog(t, root, name) holds the log at name beneath root as a write.Append in progress holds it, on macOS, Linux and Windows, until the release it answers is called or the test ends, so a program''s test can show its own Append waits on a held log and ends with its ctx''s error. It is Append''s own hold, which lock.Take is not on Windows: the open, refusals and hold moved from write into an internal package both import, and the lint rows that confine the kernel''s lock calls now name that package''s two system files in place of write''s. A log that is not there is made empty, as write.File makes a file; a link, a folder or anything else that is not a plain file, and a log with a second name, fail the test saying the name. Append itself is unchanged.'
